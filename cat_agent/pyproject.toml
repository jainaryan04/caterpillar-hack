[project]
name = "cat-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # WebRTC for phone voice sessions (cat/phone_voice.py). Not via pipecat-ai[webrtc]:
    # that extra pins opencv-python-headless<5, which conflicts with ours.
    "aiortc>=1.14.0,<2",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "openai-agents>=0.22.3",
    "opencv-python-headless>=5.0.0.93",
    "pinecone>=10.0.0",
    "pipecat-ai[cartesia,cerebras,deepgram,local,openai,silero]>=1.11.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
]

[dependency-groups]
video = [
    "imageio-ffmpeg>=0.6.0",
    "onnxruntime>=1.24.4",
    "rapidocr>=3.9.2",
    "yt-dlp>=2026.8.19",
]
